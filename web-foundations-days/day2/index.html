<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>QuickNotes</h1>
          <p>Capture ideas before they disappear</p>
        </div>

        <nav>
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </header>
    <main>
      <section>
        <h2>Add a Note</h2>
        <form id="note-form">
          <label for="note-input">New Note</label>
          <input type="text" id="note-input" placeholder="Type a note...." />
          <button type="submit">Add Note</button>
        </form>
      </section>

      <section>
        <h2>Your Notes</h2>
        <p id="note-count">You have two notes</p>
        <ul id="note-lists"></ul>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
